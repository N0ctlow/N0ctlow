<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#000" opacity="0.18"/>
    </pattern>
    <pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#000"/>
    </pattern>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
      .spinr { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite reverse; }
      .bob { animation: bob 2.6s ease-in-out infinite; }
      .bob2 { animation: bob 3.4s ease-in-out infinite reverse; }
      .wob { transform-box: fill-box; transform-origin: center; animation: wob 1.8s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .glitch1 { animation: g1 3s steps(1) infinite; }
      .glitch2 { animation: g2 3s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes wob { 0%,100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.08); } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes g1 { 0%,88%,100% { transform: translate(0,0); } 90% { transform: translate(-10px,4px); } 94% { transform: translate(8px,-3px); } }
      @keyframes g2 { 0%,88%,100% { transform: translate(0,0); } 90% { transform: translate(10px,-4px); } 94% { transform: translate(-8px,3px); } }
    </style>
  </defs>

  <!-- fundo em blocos que não combinam -->
  <rect width="1200" height="340" fill="#ff2e88"/>
  <polygon points="0,0 430,0 300,340 0,340" fill="#ffe500"/>
  <polygon points="760,0 1200,0 1200,340 900,340" fill="#00e1ff"/>
  <polygon points="430,0 520,0 380,340 300,340" fill="#7cff00"/>
  <polygon points="690,0 760,0 900,340 830,340" fill="#ff7a00"/>
  <rect width="1200" height="340" fill="url(#dots)"/>

  <!-- faixas listradas -->
  <rect x="-40" y="292" width="560" height="26" fill="url(#stripes)" opacity="0.85" transform="rotate(-4 240 305)"/>
  <rect x="820" y="22" width="460" height="22" fill="url(#stripes)" opacity="0.85" transform="rotate(5 1050 33)"/>

  <!-- rabiscos -->
  <path d="M40 70 q30 -40 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <path d="M960 300 q25 -35 50 0 t50 0 t50 0 t50 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M610 300 l18 -26 l18 26 l18 -26 l18 26 l18 -26" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>

  <!-- formas girando -->
  <g class="spin"><polygon points="140,170 152,200 184,200 158,218 168,250 140,230 112,250 122,218 96,200 128,200" fill="#7b2dff" stroke="#000" stroke-width="5"/></g>
  <g class="spinr"><rect x="1060" y="190" width="70" height="70" fill="#ffe500" stroke="#000" stroke-width="6"/></g>
  <g class="spin"><polygon points="1010,70 1050,140 970,140" fill="#ff2e88" stroke="#000" stroke-width="6"/></g>
  <g class="spinr"><circle cx="300" cy="80" r="26" fill="none" stroke="#000" stroke-width="7" stroke-dasharray="14 10"/></g>

  <!-- bolinhas e coisas flutuando -->
  <g class="bob"><circle cx="230" cy="250" r="20" fill="#00e1ff" stroke="#000" stroke-width="5"/></g>
  <g class="bob2"><circle cx="905" cy="215" r="14" fill="#7cff00" stroke="#000" stroke-width="5"/></g>
  <g class="bob"><path d="M75 118 L82 140 L104 147 L82 154 L75 176 L68 154 L46 147 L68 140 Z" fill="#000"/></g>
  <g class="bob2"><path d="M1125 80 L1131 100 L1151 106 L1131 112 L1125 132 L1119 112 L1099 106 L1119 100 Z" fill="#fff" stroke="#000" stroke-width="4"/></g>

  <!-- olho esquisito -->
  <g class="wob">
    <ellipse cx="1130" cy="295" rx="38" ry="24" fill="#fff" stroke="#000" stroke-width="5"/>
    <circle cx="1138" cy="295" r="12" fill="#000"/>
    <circle cx="1142" cy="290" r="4" fill="#fff"/>
  </g>

  <!-- GBZ com sombras coloridas (glitch) -->
  <g font-family="Arial Black, Impact, sans-serif" font-size="150" font-weight="900" text-anchor="middle">
    <text class="glitch1" x="606" y="196" fill="#00e1ff">GBZ</text>
    <text class="glitch2" x="594" y="190" fill="#ff2e88">GBZ</text>
    <text x="600" y="193" fill="#ffe500" stroke="#000" stroke-width="7" paint-order="stroke">GBZ</text>
  </g>

  <!-- etiqueta N0ctlow -->
  <g transform="rotate(-5 600 245)">
    <rect x="470" y="218" width="260" height="52" fill="#000"/>
    <rect x="462" y="210" width="260" height="52" fill="#fff" stroke="#000" stroke-width="5"/>
    <text x="592" y="247" font-family="Courier New, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#000">N0ctlow<tspan class="blink" fill="#ff2e88">_</tspan></text>
  </g>

  <!-- adesivo -->
  <g class="wob" transform="translate(0,0)">
    <circle cx="895" cy="100" r="58" fill="#7cff00" stroke="#000" stroke-width="6"/>
    <text x="895" y="93" font-family="Arial Black, Impact, sans-serif" font-size="17" text-anchor="middle" fill="#000">MEIO</text>
    <text x="895" y="117" font-family="Arial Black, Impact, sans-serif" font-size="17" text-anchor="middle" fill="#000">DOIDO</text>
  </g>
  <g transform="rotate(8 360 245)">
    <rect x="280" y="226" width="160" height="36" rx="18" fill="#000"/>
    <text x="360" y="250" font-family="Arial Black, Impact, sans-serif" font-size="15" text-anchor="middle" fill="#ffe500">100% ORIGINAL</text>
  </g>
</svg>
